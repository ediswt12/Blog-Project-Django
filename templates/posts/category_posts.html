{% extends 'base.html' %}

{% block content %}
<div class="container mx-auto p-6">

  <h1 class="text-3xl font-bold mb-6 text-pink-500">
    {{ category.name }}
  </h1>

  {% if posts %}
    <div class="grid grid-cols-3 gap-6">
      {% for post in posts %}
        <div class="border rounded-lg p-4 hover:shadow-lg">
          <h2 class="text-xl font-semibold mb-2">
            <a href="{% url 'category_posts' category.slug %}">
              {{ post.title }}
            </a>
          </h2>

          <p class="text-gray-600">
            {{ post.overview|truncatewords:20 }}
          </p>
        </div>
      {% endfor %}
    </div>
  {% else %}
    <p class="text-gray-500">
      Bu kateqoriyada hələ post yoxdur 🌸
    </p>
  {% endif %}

</div>
{% endblock %}
